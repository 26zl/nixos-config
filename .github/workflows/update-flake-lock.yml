name: Update flake.lock

# Updating the lock file by hand means discovering a broken package in nixpkgs
# only after a local rebuild has already failed, and then restoring the old lock
# with `git checkout flake.lock`. This job does the same work on a runner: it
# updates the inputs, builds the system closure, and opens a pull request only
# when that build succeeds. A pull request appearing is therefore the signal
# that the update is safe to pull down; silence means nixpkgs is still broken.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "update-flake-lock"
  cancel-in-progress: false

jobs:
  update:
    name: Update inputs and verify the closure builds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # A full Plasma closure does not fit alongside the runner's preinstalled
      # toolchains, and running out of space looks like an unrelated failure.
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake inputs
        id: update
        run: |
          set -euo pipefail
          nix flake update
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Flake inputs are already current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Deliberately not a failing step: while an input is broken upstream this
      # runs every week, and a standing red cross trains you to ignore it. The
      # outcome is reported instead, and the pull request is what carries signal.
      - name: Build the system closure
        id: build
        if: steps.update.outputs.changed == 'true'
        run: |
          set -uo pipefail
          if nix build --print-build-logs --no-link .#checks.x86_64-linux.toplevel; then
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Flake update held back"
              echo
              echo "The updated inputs do not build; no pull request was opened."
              echo "Re-run this workflow once the upstream package is fixed."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open a pull request
        if: steps.build.outputs.built == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: "automation/flake-lock"
          delete-branch: true
          commit-message: "flake: update locked inputs"
          title: "flake: update locked inputs"
          body: |
            Automated refresh of `flake.lock`.

            The system closure was built from these inputs on the runner before
            this pull request was opened, so the update is known to be safe to
            apply. Review the input diff below, then merge and rebuild.

            Note that pull requests opened with the default workflow token do
            not start further workflow runs; the build above is the check.
          labels: automation
          add-paths: flake.lock
